# ===================================================
# 1. CONFIGURACIÓN SERVIDOR
# ===================================================
server.port=8000
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# ===================================================
# 2. CONFIGURACIÓN MYSQL
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/gemelo_digital_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# 3. CONFIGURACIÓN JPA / HIBERNATE
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================================================
# 4. CONFIGURACIÓN DATA.SQL
# ===================================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===================================================
# 5. CONFIGURACIÓN JWT
# ===================================================
jwt.secret=ESTA_ES_UNA_CLAVE_SUPER_LARGA_Y_COMPLEJA_PARA_JWT_SPRING_BOOT_3
jwt.expiration=3600000
# Configuración de Email (Gmail example)


# Habilitar envío real de emails
app.email.enabled=true
# Propiedades adicionales para Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=development@test.com
spring.mail.password=development

# O usar un servicio de prueba como Mailtrap
# spring.mail.host=smtp.mailtrap.io
# spring.mail.port=2525
# spring.mail.username=tu-mailtrap-user
# spring.mail.password=tu-mailtrap-pass

# Configuración para desarrollo sin email real

app.email.mock=true
# Thymeleaf para emails
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
# ===================================================
# 6. CONFIGURACIÓN GOOGLE OAUTH
# ===================================================
app.google.client-id=TU_GOOGLE_CLIENT_ID.apps.googleusercontent.com

# ===================================================
# 7. CONFIGURACIÓN CORS
# ===================================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
app.frontend.url=http://localhost:3000
# ===================================================
# 8. LOGS PARA DEBUG
# ===================================================
logging.level.com.uniminuto.gemelodigital=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE